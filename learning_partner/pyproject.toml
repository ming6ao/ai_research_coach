[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-partner"
version = "0.1.0"
description = "AI Learning Partner MVP: knowledge graph, learner model, evidence, frontier, policy."
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["learning_partner*"]