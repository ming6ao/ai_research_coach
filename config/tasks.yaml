        # 1. Deterministically split data: the last int(len(X) * val_frac) rows are validation
        # 2. For each degree: fit with np.polyfit on the train split only
        # 3. Predict on train and validation, compute mean squared error for each
        # 4. Collect {degree: (train_mse, val_mse)}
        pass
        # >>> END YOUR IMPLEMENTATION <<<
  tests:
  - name: u_shape
    code: |
      import numpy as np
      np.random.seed(7)
      X = np.linspace(-3, 3, 60)
      y = 0.5 * X**2 - X + 1 + 0.2 * np.random.randn(60)
      results = dict(poly_error_curves(X, y, [1, 2, 5]))
      assert results[1][0] >= results[2][0], 'train error must drop as degree grows (underfit = high bias)'
      assert results[2][1] < results[1][1], 'degree 2 should generalize better than degree 1'
      assert results[2][1] <= results[5][1] + 1e-9, 'overfit degree 5 should not beat degree 2 on validation'
  - name: exact_fit
    code: |
