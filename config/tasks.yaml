      X = np.linspace(-2, 2, 40)
      y = X**3 - X + 1
      results = dict(poly_error_curves(X, y, [1, 3, 6]))
      assert results[6][0] <= results[3][0] + 1e-9, 'higher degree must fit train at least as well'
      assert results[3][1] < results[1][1], 'degree 3 should beat degree 1 on validation'
