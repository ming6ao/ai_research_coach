- id: mr_dl_mlp
  role: ml_researcher
  skill: deep_learning
  type: code
  prompt: Implement the full training step (zero gradients, forward pass, loss, backward pass, optimizer step) for an MLP
    using PyTorch. Fill in the markers in the class/scaffold.
  scaffold: "import torch\nimport torch.nn as nn\nimport torch.optim as optim\n\n# --- FIXED STRUCTURE: DO NOT MODIFY ---\n\
    class MLP(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.layers = nn.Sequential(\n   \
    \         nn.Linear(10, 32),\n            nn.ReLU(),\n            nn.Linear(32, 1)\n        )\n\n    def forward(self,\
    \ x):\n        return self.layers(x)\n\ndef train_step(model, optimizer, criterion, x, target):\n    # >>> START YOUR\
    \ IMPLEMENTATION <<<\n    # 1. Zero the gradients\n    # 2. Forward pass\n    # 3. Compute loss\n    # 4. Backward pass\n\
    \    # 5. Optimizer step\n    pass\n    # >>> END YOUR IMPLEMENTATION <<<\n\n# Test setup\nmodel = MLP()\noptimizer =\
    \ optim.SGD(model.parameters(), lr=0.01)\ncriterion = nn.MSELoss()\nx = torch.randn(1, 10)\ntarget = torch.randn(1, 1)\n\
    # train_step(model, optimizer, criterion, x, target)"
  tests:
  - name: step_updates_weights
    code: 'import torch, torch.nn as nn, torch.optim as optim

      model = MLP()

      opt = optim.SGD(model.parameters(), lr=0.1)

      crit = nn.MSELoss()

      x = torch.randn(4, 10)

      target = torch.randn(4, 1)

      p0 = [p.clone() for p in model.parameters()]

      loss = train_step(model, opt, crit, x, target)

      assert loss is not None, ''train_step must return the loss''

      changed = any(not torch.equal(a, b) for a, b in zip(p0, model.parameters()))

      assert changed, ''optimizer did not update weights'''
  - name: loss_decreases
    code: 'import torch, torch.nn as nn, torch.optim as optim

      model = MLP()

      opt = optim.SGD(model.parameters(), lr=0.05)

      crit = nn.MSELoss()

      x = torch.randn(4, 10)

      target = torch.randn(4, 1)

      loss0 = train_step(model, opt, crit, x, target)

      loss1 = train_step(model, opt, crit, x, target)

      assert loss1 <= loss0 + 1e-4, ''loss should not increase across consecutive steps'''
  max_score: 5
