tasks:
- id: mr_ml_03
  skill: ml_fundamentals
  difficulty: 2
  prompt: 'Implement overfitting detection from training and validation loss curves.
    Return the 0-based epoch index of the first local minimum of the validation loss
    (the epoch where validation loss stops improving and starts rising again while
    training loss keeps decreasing). Return -1 if no overfitting is detected. Signature:
    def detect_overfitting(train_losses, val_losses):'
  max_score: 5
  hints:
  - id: h1
    text: Overfitting shows up when validation loss starts rising while training
      loss keeps falling. You only need to find the first local minimum of the 
      validation loss curve.
    weight: 0.1
    reveal_threshold: 0.65
  - id: h2
    text: A 'local minimum' at epoch i means val_losses[i] is below its 
      immediate neighbors val_losses[i-1] and val_losses[i+1]. Return the 
      earliest such epoch.
    weight: 0.15
    reveal_threshold: 0.5
  - id: h3
    text: Loop i from 1 to len(val_losses)-1; if val_losses[i] < val_losses[i-1]
      and val_losses[i] < val_losses[i+1], return i. If none found, return -1.
    weight: 0.25
    reveal_threshold: 0.35
- id: mr_ml_04
  skill: ml_fundamentals
  difficulty: 3
  prompt: Illustrate the bias-variance tradeoff with polynomial regression. Fit 
    polynomials of each requested degree on a train split and return a dict 
    mapping each degree to a (train_mse, val_mse) tuple so the degree that 
    generalizes best (lowest validation error) can be identified.
  scaffold: "import numpy as np\n\ndef poly_error_curves(X, y, degrees, val_frac=0.2):\n\
    \    \"\"\"\n    X: (N,) 1D feature values\n    y: (N,) target values\n    degrees:
    list of polynomial degrees to try\n    Returns: dict mapping degree -> (train_mse,
    val_mse)\n    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Deterministically
    split data: the last int(len(X) * val_frac) rows are validation\n    # 2. For
    each degree: fit with np.polyfit on the train split only\n    # 3. Predict on
    train and validation, compute mean squared error for each\n    # 4. Collect {degree:
    (train_mse, val_mse)}\n    pass\n    # >>> END YOUR IMPLEMENTATION <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: MSE = mean((pred - actual)**2). Fit on the train split only, then 
      evaluate on both train and validation to expose the bias-variance 
      tradeoff.
    weight: 0.1
    reveal_threshold: 0.65
  - id: h2
    text: Use np.polyfit(X_train, y_train, deg) and np.polyval, or np.poly1d. 
      Low degrees underfit (high train + val error); high degrees overfit (low 
      train, high val).
    weight: 0.15
    reveal_threshold: 0.5
  - id: h3
    text: 'Split: split = int(len(X) * val_frac); X_train, y_train = X[:-split], y[:-split];
      X_val, y_val = X[-split:], y[-split:].'
    weight: 0.25
    reveal_threshold: 0.35
- id: mr_dl_02
  skill: deep_learning
  difficulty: 3
  prompt: Detect the vanishing gradient problem in a deep network. Compute the 
    L2 gradient norm of each layer with parameters, ordered from the output 
    layer back to the input layer, and report whether gradients vanish (the 
    earliest layer's norm is much smaller than the output layer's).
  scaffold: "import torch\nimport torch.nn as nn\n\ndef layer_gradient_norms(model,
    x, target):\n    \"\"\"\n    Returns a list of L2 gradient norms, one per layer
    with parameters,\n    ordered from the output layer back to the input layer.\n\
    \    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Zero all gradients\n\
    \    # 2. Forward pass and compute MSE loss between model(x) and target\n    #
    3. Backward pass\n    # 4. For each child layer with parameters, compute the combined
    L2 norm of\n    #    that layer's weight and bias gradients, reversing to output
    -> input order\n    pass\n    # >>> END YOUR IMPLEMENTATION <<<\n\ndef has_vanishing_gradient(norms,
    threshold=0.05):\n    \"\"\"\n    Return True if the input-side (earliest) layer
    gradient norm is less than\n    `threshold` times the output-side (latest) layer
    norm.\n    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    pass\n    # >>>
    END YOUR IMPLEMENTATION <<<\n\n# Test setup\nmodel = nn.Sequential(\n    nn.Linear(10,
    64), nn.ReLU(),\n    nn.Linear(64, 64), nn.ReLU(),\n    nn.Linear(64, 1),\n)\n\
    x = torch.randn(4, 10)\ntarget = torch.randn(4, 1)\n# norms = layer_gradient_norms(model,
    x, target)\n"
  max_score: 5
  hints:
  - id: h1
    text: A gradient norm is the L2 norm of the flattened gradient of a layer. 
      Run a backward pass first so the .grad attributes are populated.
    weight: 0.1
    reveal_threshold: 0.65
  - id: h2
    text: out = model(x); loss = F.mse_loss(out, target); loss.backward(). Then 
      for each layer in reversed(model.children()), combine that layer's 
      weight/bias gradients into one L2 norm.
    weight: 0.15
    reveal_threshold: 0.5
  - id: h3
    text: norm = torch.sqrt(sum(p.grad.flatten()**2 for p in 
      layer.parameters())) for each layer in reversed(list(model.children())) 
      that has parameters.
    weight: 0.25
    reveal_threshold: 0.35
- id: mr_math_02
  skill: math_stats
  difficulty: 1
  prompt: 'Implement population and sample variance from scratch (no numpy). Recall
    that variance scales quadratically under linear transforms: Var(a*X+b) == a**2
    * Var(X). Signature: def variance(X, ddof=0): where X is a list of numbers, ddof=0
    gives population variance (divide by n) and ddof=1 gives sample variance (divide
    by n-1).'
  max_score: 5
  hints:
  - id: h1
    text: Population variance divides by n; sample variance divides by n-1 
      (Bessel's correction).
    weight: 0.1
    reveal_threshold: 0.65
  - id: h2
    text: variance = sum((x - mean)**2 for x in X) / (n - ddof). Var(aX+b) = a^2
      * Var(X) is a useful sanity check.
    weight: 0.15
    reveal_threshold: 0.5
  - id: h3
    text: mean = sum(X) / len(X); return sum((x - mean) ** 2 for x in X) / 
      (len(X) - ddof).
    weight: 0.25
    reveal_threshold: 0.35
- id: mr_exp_02
  skill: experimentation
  difficulty: 3
  prompt: 'Determine whether an observed accuracy lift is real and not noise using
    a permutation test. Implement a two-sided permutation test on the difference of
    means (treatment - control) and return the p-value: the fraction of randomly re-shuffled
    splits whose difference of means is at least as extreme in absolute value as the
    observed difference.'
  scaffold: "import numpy as np\n\ndef permutation_pvalue(control, treatment, n_permutations=1000,
    seed=0):\n    \"\"\"\n    control: array of control run scores\n    treatment:
    array of treatment run scores\n    n_permutations: number of random shuffles\n\
    \    seed: RNG seed for reproducibility\n    Returns: two-sided p-value (float
    in [0, 1])\n    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Observed
    difference = mean(treatment) - mean(control)\n    # 2. Pool both samples, then
    for each permutation: shuffle, split into\n    #    groups of the same sizes,
    recompute the difference of means\n    # 3. p-value = (#permuted differences with
    abs >= abs(observed)) / n_permutations\n    pass\n    # >>> END YOUR IMPLEMENTATION
    <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: The p-value is the fraction of random re-shuffles whose |difference of
      means| is at least as extreme as the observed one.
    weight: 0.1
    reveal_threshold: 0.65
  - id: h2
    text: 'pooled = np.concatenate([control, treatment]); observed = treatment.mean()
      - control.mean(). For each permutation: shuffle pooled, split into two groups
      of the original sizes, recompute the difference of means.'
    weight: 0.15
    reveal_threshold: 0.5
  - id: h3
    text: rng = np.random.default_rng(seed). p = (count of permuted diffs with 
      abs >= abs(observed)) / n_permutations.
    weight: 0.25
    reveal_threshold: 0.35
- id: mi_sys_02
  skill: systems
  difficulty: 2
  prompt: Implement top-k gradient compression, a technique that reduces 
    communication overhead in data-parallel training. Given a 1D list of 
    gradient values, zero out all entries except the k with the largest absolute
    value (ties keep the earlier index) and return the compressed list.
  scaffold: "import numpy as np\n\ndef topk_compress(grads, k):\n    \"\"\"\n    grads:
    1D list/array of gradient values\n    k: number of entries to keep\n    Returns:
    compressed list with all but the top-k (by absolute value) entries zeroed\n  \
    \  \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Find the indices
    of the k entries with the largest absolute value\n    # 2. Build the output with
    only those entries preserved (ties keep the earlier index)\n    pass\n    # >>>
    END YOUR IMPLEMENTATION <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: Keep the k entries with the largest absolute value and zero out 
      everything else; ties keep the earlier index.
    weight: 0.1
    reveal_threshold: 0.65
  - id: h2
    text: np.argsort(np.abs(grads))[::−1][:k] gives the indices of the top-k 
      entries by magnitude; build the output preserving those entries.
    weight: 0.15
    reveal_threshold: 0.5
  - id: h3
    text: out = np.zeros_like(grads); idx = np.argsort(-np.abs(grads))[:k]; 
      out[idx] = grads[idx].
    weight: 0.25
    reveal_threshold: 0.35
