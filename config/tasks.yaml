- id: mr_dl_bn
  role: ml_researcher
  skill: deep_learning
  type: code
  prompt: 'Implement Batch Normalization for a 2D input (batch, features): normalize with batch statistics during training,
    update running stats, scale/shift with gamma/beta.'
  scaffold: "import torch\nimport torch.nn as nn\n\nclass CustomBatchNorm1d(nn.Module):\n    def __init__(self, num_features,\
    \ eps=1e-5, momentum=0.1):\n        super().__init__()\n        self.num_features = num_features\n        self.eps = eps\n\
    \        self.momentum = momentum\n        \n        # Learnable parameters\n        self.gamma = nn.Parameter(torch.ones(num_features))\n\
    \        self.beta = nn.Parameter(torch.zeros(num_features))\n        \n        # Running statistics\n        self.register_buffer('running_mean',\
    \ torch.zeros(num_features))\n        self.register_buffer('running_var', torch.ones(num_features))\n\n    def forward(self,\
    \ x):\n        # x shape: (batch_size, num_features)\n        # >>> START YOUR IMPLEMENTATION <<<\n        # 1. Calculate\
    \ mean and variance of the batch (if training)\n        # 2. Update running statistics (if training)\n        # 3. Normalize\
    \ the input\n        # 4. Scale and shift using gamma and beta\n        pass\n        # >>> END YOUR IMPLEMENTATION <<<\n\
    \n# Test\nbn = CustomBatchNorm1d(10)\nx = torch.randn(5, 10)\n# output = bn(x)"
  tests:
  - name: shape_and_stats
    code: 'import torch

      bn = CustomBatchNorm1d(4)

      bn.train()

      x = torch.randn(8, 4)

      y = bn(x)

      assert y.shape == x.shape

      assert torch.allclose(y.mean(0), torch.zeros(4), atol=1e-2), ''output mean != 0''

      assert torch.allclose(y.var(0, unbiased=False), torch.ones(4), atol=1e-1), ''output var != 1'''
  - name: running_stats_update
    code: 'import torch

      bn = CustomBatchNorm1d(4, momentum=0.1)

      bn.train()

      x = torch.randn(8, 4)

      bn(x)

      assert torch.allclose(bn.running_mean, 0.1 * x.mean(0), atol=1e-2), ''running_mean not updated with momentum''

      assert torch.allclose(bn.running_var, 0.1 * x.var(0, unbiased=False) + 0.9 * 1.0, atol=1e-1), ''running_var not updated'''
  max_score: 5
