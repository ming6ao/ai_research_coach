  scaffold: "class SlidingWindow:\n    def __init__(self, size: int):\n        self.size
    = size\n        # >>> START YOUR IMPLEMENTATION <<<\n        # Initialize a buffer
    to hold the window events\n        pass\n        # >>> END YOUR IMPLEMENTATION
