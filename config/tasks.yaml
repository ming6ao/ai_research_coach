tasks:
- id: mr_ml_03
  skill: ml_fundamentals
  difficulty: 2
  prompt: 'Implement overfitting detection from training and validation loss curves.
    Return the 0-based epoch index of the first local minimum of the validation loss
    (the epoch where validation loss stops improving and starts rising again while
    training loss keeps decreasing). Return -1 if no overfitting is detected. Signature:
    def detect_overfitting(train_losses, val_losses):'
  max_score: 5
  hints:
  - id: h1
    text: "Overfitting occurs when the model memorizes training data instead of generalizing.
      In loss curves, this manifests as training loss continuing to decrease while
      validation loss starts increasing."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "You need to find the first local minimum of the validation loss curve:
      the point where `val_losses[i]` is lower than both its neighbors, after which
      validation loss starts rising."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: "Iterate through the validation losses from index `1` to `len(val_losses)-2`
      (the first and last epochs cannot be local minima since they lack both neighbors).
      For each index `i`, check if `val_losses[i] < val_losses[i-1]` and `val_losses[i]
      < val_losses[i+1]`."
    weight: 0.12
    reveal_threshold: 0.50
  - id: h4
    text: |
      ```python
      def detect_overfitting(train_losses, val_losses):
          for i in range(1, len(val_losses) - 1):
              if val_losses[i] < val_losses[i-1] and val_losses[i] < val_losses[i+1]:
                  return i
          return -1
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h5
    text: "Edge cases: if `val_losses` has fewer than 3 elements, no local minimum is
      possible so return -1 immediately. The train_losses parameter is not actually
      needed for the logic; the question is about the shape of `val_losses` alone."
    weight: 0.25
    reveal_threshold: 0.20
- id: mr_ml_04
  skill: ml_fundamentals
  difficulty: 3
  prompt: Illustrate the bias-variance tradeoff with polynomial regression. Fit
    polynomials of each requested degree on a train split and return a dict
    mapping each degree to a (train_mse, val_mse) tuple so the degree that
    generalizes best (lowest validation error) can be identified.
  scaffold: "import numpy as np\n\ndef poly_error_curves(X, y, degrees, val_frac=0.2):\n\
    \    \"\"\"\n    X: (N,) 1D feature values\n    y: (N,) target values\n    degrees:
    list of polynomial degrees to try\n    Returns: dict mapping degree -> (train_mse,
    val_mse)\n    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Deterministically
    split data: the last int(len(X) * val_frac) rows are validation\n    # 2. For
    each degree: fit with np.polyfit on the train split only\n    # 3. Predict on
    train and validation, compute mean squared error for each\n    # 4. Collect {degree:
    (train_mse, val_mse)}\n    pass\n    # >>> END YOUR IMPLEMENTATION <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: "The bias-variance tradeoff: low-degree polynomials underfit (high bias,
      both train and val error are high), high-degree polynomials overfit (low train
      error but high val error). You want to see this pattern across degrees."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "Split the data deterministically: the last int(len(X) * val_frac) rows
      are validation, the rest are training. Fit each polynomial on the training
      split only, then evaluate on both splits."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: |
      NumPy polynomial fitting tutorial: `np.polyfit(x, y, deg)` returns coefficients
      (highest degree first) that minimize squared error. `np.polyval(coeffs, x)`
      evaluates the polynomial at x. Example:
      ```python
      coeffs = np.polyfit(x_train, y_train, 2)  # fit quadratic
      y_pred = np.polyval(coeffs, x_test)       # evaluate on test data
      mse = np.mean((y_pred - y_test) ** 2)     # mean squared error
      ```
      `np.poly1d(coeffs)` creates a callable polynomial object: `p = np.poly1d(coeffs);
      y_pred = p(x)`.
    weight: 0.10
    reveal_threshold: 0.55
  - id: h4
    text: |
      Use `np.polyfit(X_train, y_train, deg)` to fit, then `np.polyval(coeffs, X)` or `np.poly1d(coeffs)(X)` to predict.
      $$
      \text{MSE} = \frac{1}{N}\sum(\hat{y} - y)^2
      $$
      Collect results as `{degree: (train_mse, val_mse)}`.
    weight: 0.12
    reveal_threshold: 0.50
  - id: h5
    text: |
      ```python
      split = int(len(X) * val_frac)
      X_train, y_train = X[:-split], y[:-split]
      X_val, y_val = X[-split:], y[-split:]
      results = {}
      for deg in degrees:
          coeffs = np.polyfit(X_train, y_train, deg)
          train_pred = np.polyval(coeffs, X_train)
          val_pred = np.polyval(coeffs, X_val)
          train_mse = np.mean((train_pred - y_train)**2)
          val_mse = np.mean((val_pred - y_val)**2)
          results[deg] = (train_mse, val_mse)
      return results
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h6
    text: "Edge cases: if `split == 0` (very small dataset with large `val_frac`), there
      are no training points so handle gracefully. Also ensure `degrees` is iterable
      even if empty. The bias-variance pattern is visible when `train_mse` decreases
      with degree while `val_mse` first decreases then increases."
    weight: 0.25
    reveal_threshold: 0.20
- id: mr_dl_02
  skill: deep_learning
  difficulty: 3
  prompt: Detect the vanishing gradient problem in a deep network. Compute the
    L2 gradient norm of each layer with parameters, ordered from the output
    layer back to the input layer, and report whether gradients vanish (the
    earliest layer's norm is much smaller than the output layer's).
  scaffold: "import torch\nimport torch.nn as nn\n\ndef layer_gradient_norms(model,
    x, target):\n    \"\"\"\n    Returns a list of L2 gradient norms, one per layer
    with parameters,\n    ordered from the output layer back to the input layer.\n\
    \    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Zero all gradients\n\
    \    # 2. Forward pass and compute MSE loss between model(x) and target\n    #
    3. Backward pass\n    # 4. For each child layer with parameters, compute the combined
    L2 norm of\n    #    that layer's weight and bias gradients, reversing to output
    -> input order\n    pass\n    # >>> END YOUR IMPLEMENTATION <<<\n\ndef has_vanishing_gradient(norms,
    threshold=0.05):\n    \"\"\"\n    Return True if the input-side (earliest) layer
    gradient norm is less than\n    `threshold` times the output-side (latest) layer
    norm.\n    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    pass\n    # >>>
    END YOUR IMPLEMENTATION <<<\n\n# Test setup\nmodel = nn.Sequential(\n    nn.Linear(10,
    64), nn.ReLU(),\n    nn.Linear(64, 64), nn.ReLU(),\n    nn.Linear(64, 1),\n)\n\
    x = torch.randn(4, 10)\ntarget = torch.randn(4, 1)\n# norms = layer_gradient_norms(model,
    x, target)\n"
  max_score: 5
  hints:
  - id: h1
    text: "Vanishing gradients mean deep layers receive extremely small gradient signals
      during backpropagation, making them learn very slowly. You detect this by comparing
      gradient magnitudes across layers."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "First run a forward pass and backward pass to populate .grad attributes:
      out = model(x); loss = F.mse_loss(out, target); loss.backward(). Then iterate
      through layers in reverse order (output to input) to collect gradient norms."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: |
      PyTorch gradient norm tutorial: after `loss.backward()`, each parameter's
      gradient is in `p.grad` (a tensor). To compute the L2 norm of a layer's
      combined gradients:
      ```python
      # Flatten all parameter gradients and compute L2 norm
      norm = torch.sqrt(sum(p.grad.flatten().pow(2).sum() for p in layer.parameters()))
      # Or equivalently:
      norm = torch.sqrt(sum(p.grad.norm()**2 for p in layer.parameters()))
      ```
      Use `model.children()` to iterate layers, `reversed()` for output-to-input
      order. Check `len(list(layer.parameters())) > 0` to skip parameter-free layers.
    weight: 0.10
    reveal_threshold: 0.55
  - id: h4
    text: "For each layer that has parameters, compute the L2 norm of all its gradients
      combined: `torch.sqrt(sum(p.grad.flatten().pow(2) for p in layer.parameters()))`.
      Use `reversed(list(model.children()))` to go from output to input."
    weight: 0.12
    reveal_threshold: 0.50
  - id: h5
    text: |
      ```python
      def layer_gradient_norms(model, x, target):
          model.zero_grad()
          out = model(x)
          loss = nn.MSELoss()(out, target)
          loss.backward()
          norms = []
          for layer in reversed(list(model.children())):
              params = list(layer.parameters())
              if params:
                  norm = torch.sqrt(sum(p.grad.flatten().pow(2) for p in params))
                  norms.append(norm.item())
          return norms

      def has_vanishing_gradient(norms, threshold=0.05):
          if not norms:
              return False
          return norms[-1] < threshold * norms[0]
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h6
    text: "Edge cases: a layer with no parameters (like ReLU) should be skipped. If
      the model has no parameterized layers, return an empty list. The norms list
      is ordered output-to-input, so norms[0] is the output layer and norms[-1]
      is the input layer. has_vanishing_gradient checks if the input layer norm is
      below threshold times the output layer norm."
    weight: 0.25
    reveal_threshold: 0.20
- id: mr_math_02
  skill: math_stats
  difficulty: 1
  prompt: 'Implement population and sample variance from scratch (no numpy). Recall
    that variance scales quadratically under linear transforms: Var(a*X+b) == a**2
    * Var(X). Signature: def variance(X, ddof=0): where X is a list of numbers, ddof=0
    gives population variance (divide by n) and ddof=1 gives sample variance (divide
    by n-1).'
  max_score: 5
  hints:
  - id: h1
    text: "Variance measures how spread out data is from its mean. Population variance
      divides by n (the full dataset), sample variance divides by n-1 (Bessel's correction
      to correct for bias when estimating from a sample)."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "The formula is: compute the mean, then compute the average of squared deviations
      from the mean. The only difference between population and sample variance is
      the denominator: n for ddof=0, n-1 for ddof=1."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: |
      ```
      mean = sum(X) / len(X)
      squared_diffs = [(x - mean) ** 2 for x in X]
      return sum(squared_diffs) / (len(X) - ddof)
      ```
    weight: 0.12
    reveal_threshold: 0.50
  - id: h4
    text: |
      ```python
      def variance(X, ddof=0):
          n = len(X)
          mean = sum(X) / n
          return sum((x - mean) ** 2 for x in X) / (n - ddof)
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h5
    text: "Edge cases: if `X` is empty, division by zero occurs so handle gracefully
      (return 0.0 or raise). If `X` has one element and `ddof=1`, division by zero occurs.
      The property $\\text{Var}(aX+b) = a^2 \\cdot \\text{Var}(X)$ is a good sanity check:
      standardizing data (subtract mean, divide by std) should give variance close to 1.0."
    weight: 0.25
    reveal_threshold: 0.20
- id: mr_exp_02
  skill: experimentation
  difficulty: 3
  prompt: 'Determine whether an observed accuracy lift is real and not noise using
    a permutation test. Implement a two-sided permutation test on the difference of
    means (treatment - control) and return the p-value: the fraction of randomly re-shuffled
    splits whose difference of means is at least as extreme in absolute value as the
    observed difference.'
  scaffold: "import numpy as np\n\ndef permutation_pvalue(control, treatment, n_permutations=1000,
    seed=0):\n    \"\"\"\n    control: array of control run scores\n    treatment:
    array of treatment run scores\n    n_permutations: number of random shuffles\n\
    \    seed: RNG seed for reproducibility\n    Returns: two-sided p-value (float
    in [0, 1])\n    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Observed
    difference = mean(treatment) - mean(control)\n    # 2. Pool both samples, then
    for each permutation: shuffle, split into\n    #    groups of the same sizes,
    recompute the difference of means\n    # 3. p-value = (#permuted differences with
    abs >= abs(observed)) / n_permutations\n    pass\n    # >>> END YOUR IMPLEMENTATION
    <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: "A permutation test asks: if the treatment had no real effect, how likely
      is it that we would see a difference this large just by chance? The p-value
      answers this by comparing the observed difference to differences from random
      reassignments."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "Pool all observations together, then repeatedly shuffle and re-split into
      control and treatment groups of the original sizes. For each shuffle, compute
      the difference of means. The p-value is the fraction of these permuted differences
      whose absolute value is >= the observed absolute difference."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: |
      NumPy random sampling tutorial: `np.random.default_rng(seed)` creates a reproducible
      RNG. Key methods: `rng.random()` draws Uniform(0,1), `rng.shuffle(arr)` shuffles
      in-place, `rng.permutation(arr)` returns a shuffled copy. For pooling:
      ```python
      pooled = np.concatenate([control, treatment])  # combine arrays
      rng.shuffle(pooled)                             # shuffle in-place
      diff = pooled[n_c:].mean() - pooled[:n_c].mean()  # split and compute
      ```
      Use `np.abs()` for absolute value and boolean comparison `>=` for counting.
    weight: 0.10
    reveal_threshold: 0.55
  - id: h4
    text: "```python\nobserved = treatment.mean() - control.mean()\npooled = np.concatenate([control,\n  treatment])\nn_c, n_t = len(control), len(treatment)\n```\nUse `np.random.default_rng(seed)` for reproducibility."
    weight: 0.12
    reveal_threshold: 0.50
  - id: h5
    text: |
      ```python
      def permutation_pvalue(control, treatment, n_permutations=1000, seed=0):
          rng = np.random.default_rng(seed)
          observed = treatment.mean() - control.mean()
          pooled = np.concatenate([control, treatment])
          n_c = len(control)
          count = 0
          for _ in range(n_permutations):
              rng.shuffle(pooled)
              diff = pooled[n_c:].mean() - pooled[:n_c].mean()
              if abs(diff) >= abs(observed):
                  count += 1
          return count / n_permutations
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h6
    text: "Edge cases: if n_permutations is 0, return 0.0. If control or treatment
      is empty, handle gracefully. The two-sided nature means we check abs(diff) >=
      abs(observed), not just diff >= observed. Shuffling modifies pooled in-place,
      so recompute the split each iteration."
    weight: 0.25
    reveal_threshold: 0.20
- id: mi_sys_02
  skill: systems
  difficulty: 2
  prompt: Implement top-k gradient compression, a technique that reduces
    communication overhead in data-parallel training. Given a 1D list of
    gradient values, zero out all entries except the k with the largest absolute
    value (ties keep the earlier index) and return the compressed list.
  scaffold: "import numpy as np\n\ndef topk_compress(grads, k):\n    \"\"\"\n    grads:
    1D list/array of gradient values\n    k: number of entries to keep\n    Returns:
    compressed list with all but the top-k (by absolute value) entries zeroed\n  \
    \    \"\"\"\n    # >>> START YOUR IMPLEMENTATION <<<\n    # 1. Find the indices
    of the k entries with the largest absolute value\n    # 2. Build the output with
    only those entries preserved (ties keep the earlier index)\n    pass\n    # >>>
    END YOUR IMPLEMENTATION <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: "Gradient compression reduces communication cost by only transmitting the
      most important (largest magnitude) gradient values, zeroing out the rest. This
      is a lossy approximation that preserves the strongest signals."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "Sort gradients by their absolute values in descending order, take the first
      k indices, and keep only those entries. All other entries become zero."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: |
      NumPy sorting and indexing tutorial: `np.argsort(arr)` returns indices that
      sort an array in ascending order. Use `[::-1]` to reverse for descending.
      `np.abs(arr)` computes element-wise absolute value. To keep only top-k:
      ```python
      grads = np.asarray(grads)
      idx = np.argsort(-np.abs(grads))[:k]  # indices of k largest magnitudes
      out = np.zeros_like(grads)
      out[idx] = grads[idx]                  # fancy indexing to preserve values
      ```
      `np.zeros_like(arr)` creates a zero array with the same shape/dtype.
    weight: 0.10
    reveal_threshold: 0.55
  - id: h4
    text: "`np.argsort(np.abs(grads))` returns indices sorted by magnitude ascending.
      Reverse with `[::-1]` to get descending, then take `[:k]` for the top-k indices.
      Ties naturally keep the earlier index because argsort is stable."
    weight: 0.12
    reveal_threshold: 0.50
  - id: h5
    text: |
      ```python
      def topk_compress(grads, k):
          grads = np.asarray(grads)
          out = np.zeros_like(grads)
          idx = np.argsort(-np.abs(grads))[:k]
          out[idx] = grads[idx]
          return out
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h6
    text: "Edge cases: if k >= len(grads), keep everything (no compression). If k
      is 0, return all zeros. If grads is empty, return an empty array. The negative
      sign in -np.abs(grads) makes argsort sort descending by absolute value."
    weight: 0.25
    reveal_threshold: 0.20
- id: mi_mlops_02
  skill: mlops
  difficulty: 3
  prompt: 'Implement a ModelRegistry for ML deployment: register versions, promote
    one to production (with rollback to the previous version), and gate canary deployments
    on the observed error rate.'
  scaffold: "class ModelRegistry:\n    def __init__(self):\n        self.versions
    = {}    # version_id -> 'registered' (production versions tracked separately)\n\
    \        self.production = None\n        self._history = []    # stack of previous
    production version ids\n        # >>> START YOUR IMPLEMENTATION <<<\n        pass\n\
    \        # >>> END YOUR IMPLEMENTATION <<<\n\n    def register(self, version_id:
    str) -> None:\n        # >>> START YOUR IMPLEMENTATION <<<\n        # Add version_id
    as 'registered'; raise ValueError if it already exists\n        pass\n       \
    \ # >>> END YOUR IMPLEMENTATION <<<\n\n    def promote(self, version_id: str)
    -> None:\n        # >>> START YOUR IMPLEMENTATION <<<\n        # Promote a registered
    version to production. If a version is already in\n        # production, push
    it onto the history stack first.\n        pass\n        # >>> END YOUR IMPLEMENTATION
    <<<\n\n    def rollback(self) -> None:\n        # >>> START YOUR IMPLEMENTATION
    <<<\n        # Restore the most recent previous production version from the history\n\
    \        # stack (set production to None if the stack is empty).\n        pass\n\
    \        # >>> END YOUR IMPLEMENTATION <<<\n\n    def canary_gate(self, canary_error_rate:
    float, baseline_error_rate: float, threshold: float = 0.01) -> bool:\n       \
    \ \"\"\"\n        Return True if the canary is safe to promote: canary_error_rate
    must\n        not exceed baseline_error_rate + threshold.\n        \"\"\"\n  \
    \      # >>> START YOUR IMPLEMENTATION <<<\n        pass\n        # >>> END YOUR
    IMPLEMENTATION <<<\n"
  max_score: 5
  hints:
  - id: h1
    text: "A model registry tracks model versions through their lifecycle: registration,
      promotion to production, and rollback. It also gates canary deployments by
      comparing error rates against a baseline."
    weight: 0.05
    reveal_threshold: 0.75
  - id: h2
    text: "Use three data structures: a dict for registered versions, a string for
      the current production version, and a list as a stack for rollback history.
      Register adds to the dict (reject duplicates), promote pushes current production
      onto the stack before updating, rollback pops from the stack."
    weight: 0.08
    reveal_threshold: 0.65
  - id: h3
    text: "`register`: check if `version_id` already in `self.versions`, raise `ValueError`
      if so, otherwise add it. `promote`: if `self.production` is not `None`, append it
      to `self._history`, then set `self.production = version_id`. `rollback`: pop from
      `self._history` if non-empty, else set `self.production = None`."
    weight: 0.12
    reveal_threshold: 0.50
  - id: h4
    text: |
      ```python
      def register(self, version_id):
          if version_id in self.versions:
              raise ValueError(f'{version_id} already registered')
          self.versions[version_id] = 'registered'

      def promote(self, version_id):
          if self.production is not None:
              self._history.append(self.production)
          self.production = version_id

      def rollback(self):
          self.production = self._history.pop() if self._history else None

      def canary_gate(self, canary_error_rate, baseline_error_rate, threshold=0.01):
          return canary_error_rate <= baseline_error_rate + threshold
      ```
    weight: 0.18
    reveal_threshold: 0.35
  - id: h5
    text: "Edge cases: promote a version that was never registered should probably
      fail, but the current scaffold does not enforce this so assume any string is
      valid. Rollback on empty history returns None (no production). Canary gate
      uses <= not <, meaning equal error rates are acceptable."
    weight: 0.25
    reveal_threshold: 0.20
