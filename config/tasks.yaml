  difficulty: 3
  dimension: coding
  prompt: 'Illustrate the bias-variance tradeoff with polynomial regression. Fit polynomials of each
    requested degree on a train split and return a dict mapping each degree to a (train_mse, val_mse)
    tuple so the degree that generalizes best (lowest validation error) can be identified.'
  scaffold: |
