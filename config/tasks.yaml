    \    def __init__(self, d_model, num_heads):\n        super().__init__()\n        assert d_model % num_heads == 0\n  \
    \      \n        self.d_model = d_model\n        self.num_heads = num_heads\n        self.d_k = d_model // num_heads\n\
    \        \n        self.w_q = nn.Linear(d_model, d_model)\n        self.w_k = nn.Linear(d_model, d_model)\n        self.w_v\
    \ = nn.Linear(d_model, d_model)\n        self.w_o = nn.Linear(d_model, d_model)\n\n    def forward(self, q, k, v, mask=None):\n\
    \        # q, k, v shape: (batch_size, seq_len, d_model)\n        # >>> START YOUR IMPLEMENTATION <<<\n        # 1. Linear\
    \ projections\n        # 2. Reshape for multi-head\n        # 3. Scaled dot-product attention\n        # 4. Concatenate\
    \ heads\n        # 5. Final linear projection\n        pass\n        # >>> END YOUR IMPLEMENTATION <<<\n\n# Test dimensions\n\
    batch_size, seq_len, d_model, num_heads = 2, 8, 64, 8\nmha = MultiHeadAttention(d_model, num_heads)\nx = torch.randn(batch_size,\
    \ seq_len, d_model)\n# output = mha(x, x, x)"
  tests:
  - name: shape
    code: 'import torch

      mha = MultiHeadAttention(64, 8)

      x = torch.randn(2, 8, 64)

      out = mha(x, x, x)

      assert out.shape == (2, 8, 64), f''got {out.shape}'''
  - name: uses_values
    code: 'import torch

      mha = MultiHeadAttention(16, 4)

      x = torch.randn(2, 6, 16)

      out1 = mha(x, x, x)

      v = torch.randn(2, 6, 16)

      out2 = mha(x, x, v)

      assert not torch.allclose(out1, out2), ''output does not depend on V - attention not implemented'''
