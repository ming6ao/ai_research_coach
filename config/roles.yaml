roles:
  ml_researcher:
    name: ML Researcher
    description: Designs models, runs experiments, and advances ML methods.
    skills:
      - id: ml_fundamentals
        name: ML Fundamentals
        description: Core ML concepts, algorithms, and theory
        importance: 5
      - id: deep_learning
        name: Deep Learning
        description: Neural network architectures, training, and optimization
        importance: 5
      - id: math_stats
        name: Math & Statistics
        description: Linear algebra, probability, statistical inference
        importance: 4
      - id: experimentation
        name: Experimentation & Evaluation
        description: Experimental design, metrics, statistical significance
        importance: 4
      - id: research_coding
        name: Research Coding
        description: Python, NumPy, PyTorch implementation skills
        importance: 5

  ml_infra_engineer:
    name: ML Infra Engineer
    description: Builds training/inference platforms, pipelines, and distributed systems.
    skills:
      - id: systems
        name: Systems & Distributed Computing
        description: OS, networking, distributed systems fundamentals
        importance: 5
      - id: mlops
        name: MLOps & Pipelines
        description: CI/CD, model deployment, monitoring
        importance: 4
      - id: cloud
        name: Cloud & Containers
        description: Docker, Kubernetes, cloud services
        importance: 4
      - id: data_eng
        name: Data Engineering
        description: Data pipelines, streaming, storage
        importance: 4
      - id: infra_coding
        name: Infra Coding
        description: Python, Go, Bash implementation skills
        importance: 5
